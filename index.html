<!DOCTYPE html>
<html>
<head>
  <title>My Awesome Cookie Clicker</title>
  <style>
    body {
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      height: 100vh;
      margin: 0;
      padding-top: 100px;
    }
    #cookie {
      font-size: 120px;
      cursor: pointer;
      transition: transform 0.05s;
      display: inline-block;
      user-select: none;
    }
    #cookie:active {
      transform: scale(0.9);
    }
    h1 {
      color: #333;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      margin-top: 0;
    }
    #score {
      font-size: 32px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h1>Cookie Clicker</h1>
  <p>click the giant cookie to get rich</p>
  <div id="cookie">🍪</div>
  <h2 id="score">Cookies: 0</h2>

  <script>
    let score = 0;
    const cookie = document.getElementById('cookie');
    const scoreDisplay = document.getElementById('score');

    cookie.addEventListener('click', () => {
      score++;
      scoreDisplay.innerText = 'Cookies: ' + score;
    });
  </script>
</body>
</html>
